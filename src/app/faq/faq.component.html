<section class="faq-section py-10 bg-gray-100">
  <div class="container mx-auto px-4 max-w-3xl">
    <h2 class="text-2xl font-bold mb-6 text-center">Frequently Asked Questions</h2>

    <div *ngFor="let faq of faqs; let i = index" class="faq-item mb-4 border rounded-lg bg-white shadow-sm">
      <button
        (click)="toggleFaq(i)"
        class="w-full flex justify-between items-center px-4 py-3 text-left font-medium text-gray-800"
      >
        <span>{{ faq.question }}</span>
        <span [class.rotate-180]="activeIndex === i" class="transform transition-transform">▼</span>
      </button>
      <div *ngIf="activeIndex === i" class="px-4 pb-3 text-gray-600">
        {{ faq.answer }}
      </div>
    </div>
  </div>
</section>
