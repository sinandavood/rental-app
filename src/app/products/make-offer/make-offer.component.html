<div class="p-6 w-80">
  <div class="flex flex-col items-center text-center">
    <img [src]="data.imageUrl" alt="product" class="w-24 h-24 rounded-md mb-3 object-cover" />

    <h2 class="text-lg font-semibold">{{ data.productName }}</h2>
    <p class="text-sm text-gray-500">Original Rental</p>
    <p class="text-base font-bold mb-4">${{ data.price }}/day</p>
  </div>

  <div class="mb-4 w-full">
    <label class="block text-sm font-medium mb-1">Your Offer Price</label>
    <input
      type="number"
      [(ngModel)]="offerPrice"
      class="w-full border rounded-md px-3 py-2 focus:ring focus:ring-indigo-200"
      placeholder="Enter your price"
    />
  </div>

  <button
    (click)="submitOffer()"
    class="w-full bg-green-500 text-white font-medium py-2 rounded-md hover:bg-green-600"
  >
    Submit Offer
  </button>
</div>
