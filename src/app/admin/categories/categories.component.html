<div class="container modern-container mt-4">
  <h4 class="modern-title">📁 Manage Categories</h4>

  <!-- 🔄 Loading Spinner -->
  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary modern-spinner" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2 text-muted modern-text">Loading categories...</p>
  </div>

  <!-- ➕ Create Form -->
<div *ngIf="!editingCategory" class="card modern-card mb-4">
  <div class="card-body modern-card-body">
    <h5 class="card-title modern-card-title">Create Category</h5>
    <div class="row g-3 align-items-center">
      <div class="col-md-3">
        <input [(ngModel)]="newCategory.name" class="form-control modern-input" placeholder="Name" />
      </div>
      <div class="col-md-4">
        <input [(ngModel)]="newCategory.description" class="form-control modern-input" placeholder="Description" />
      </div>
      <!-- ✅ UPDATED: Changed text input to file input -->
      <div class="col-md-3">
        <input type="file" (change)="onFileSelected($event)" class="form-control modern-input" accept="image/png, image/jpeg, image/svg+xml" />
      </div>
      <div class="col-md-2">
        <button class="btn modern-btn modern-btn-primary w-100" (click)="createCategory()">
          Create
        </button>
      </div>
    </div>
  </div>
</div>

<div *ngIf="editingCategory" class="card modern-card mb-4 border-primary">
    <div class="card-body modern-card-body">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="card-title modern-card-title">Edit: {{ editingCategory.name }}</h5>
        <button class="btn-close" (click)="cancelEdit()"></button>
      </div>
      <div class="row g-3 align-items-center mt-2">
        <div class="col-md-3">
          <input [(ngModel)]="editingCategory.name" class="form-control modern-input" placeholder="Name" />
        </div>
        <div class="col-md-4">
          <input [(ngModel)]="editingCategory.description" class="form-control modern-input" placeholder="Description" />
        </div>
        <div class="col-md-3">
          <input type="file" (change)="onEditFileSelected($event)" class="form-control modern-input" accept="image/*" />
          <small class="form-text text-muted">Leave blank to keep current icon.</small>
        </div>
        <div class="col-md-2">
          <button class="btn modern-btn modern-btn-success w-100" (click)="updateCategory()">
            Save
          </button>
        </div>
      </div>
    </div>
  </div>

<!-- Create Subcategory Form -->
<div *ngIf="!editingCategory" class="card modern-card mb-4">
  <div class="card-body modern-card-body">
    <h5 class="card-title modern-card-title">Create Subcategory</h5>
    <!-- Note: Removed the form tag for simplicity, can be added back if needed -->
    <div class="row g-3 align-items-center">
      <div class="col-md-3">
        <input [(ngModel)]="subForm.name" name="name" required class="form-control modern-input" placeholder="Name" />
      </div>
      <div class="col-md-3">
        <input [(ngModel)]="subForm.description" name="description" required class="form-control modern-input" placeholder="Description" />
      </div>
      <!-- ✅ UPDATED: Changed text input to file input -->
      <div class="col-md-3">
        <input type="file" (change)="onSubCategoryFileSelected($event)" class="form-control modern-input" accept="image/png, image/jpeg, image/svg+xml" />
      </div>
      <div class="col-md-3">
        <select [(ngModel)]="subForm.parentCategoryId" name="parentCategoryId" required class="form-select modern-input">
          <option [ngValue]="null" disabled selected>Select Parent Category</option>
          <option *ngFor="let cat of categories" [ngValue]="cat.id">
            {{ cat.name }}
          </option>
        </select>
      </div>
      <div class="col-md-12 text-end">
        <button (click)="createSubCategory()" class="btn modern-btn modern-btn-primary">
          Create Subcategory
        </button>
      </div>
    </div>
  </div>
</div>


  <!---------------------------------------------------------------------------->


  <!-- 🔍 Search Input -->
  <div class="search-container mb-4">
    <input type="text" class="form-control modern-input" [(ngModel)]="searchTerm" (input)="applyFilters()"
      placeholder="Search categories..." />
  </div>

  <!-- 📋 Category Table -->
 <div class="table-responsive">
    <table class="table modern-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Description</th>
          <th>Icon</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cat of filteredCategories; let i = index" class="modern-table-row">
          <td>{{ i + 1 }}</td>
          <td>{{ cat.name }}</td>
          <td>{{ cat.description }}</td>
          <td>
            <img [src]="imageurl + cat.iconImage" height="35px" width="35px" *ngIf="cat.iconImage">
          </td>
          <td>
            <div class="action-buttons d-flex align-items-center gap-2">
              <!-- ✅ NEW: Edit Button -->
              <button class="btn modern-btn modern-btn-sm modern-btn-secondary" (click)="startEdit(cat)">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn modern-btn modern-btn-sm modern-btn-danger" (click)="deleteCategory(cat.id)">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>


  <!-- 🔢 Pagination -->
  <div class="pagination-container d-flex justify-content-between align-items-center mt-4">
    <button class="btn modern-btn modern-btn-outline modern-btn-sm" (click)="prevPage()" [disabled]="page === 1">
      Previous
    </button>
    <span class="page-info">Page {{ page }}</span>
    <button class="btn modern-btn modern-btn-outline modern-btn-sm" (click)="nextPage()"
      [disabled]="(page * pageSize) >= filteredCategories.length">
      Next
    </button>
  </div>
</div>
